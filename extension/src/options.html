<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kool Kits Settings</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="options-body">
    <main class="options">
      <header class="options-header">
        <img src="../icons/icon48.png" alt="" id="options-logo" />
        <h1 class="options-title">Kool Kits</h1>
      </header>

      <section class="options-card" id="meeting-card" data-enabled="true">
        <div class="options-card-head">
          <div>
            <div class="options-feature-title">Meeting Reminder</div>
            <div class="options-feature-desc">
              Today's meetings in your toolbar, with a countdown badge.
            </div>
          </div>
          <label class="toggle">
            <input
              id="enabled-toggle"
              type="checkbox"
              aria-label="Enable Meeting Reminder"
            />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>

        <div class="options-controls">
          <div class="options-row">
            <div class="options-row-text">
              <label class="options-label" for="lead-select">Lead time</label>
              <div class="options-hint">
                How early the badge starts counting down.
              </div>
            </div>
            <select id="lead-select" class="options-select"></select>
          </div>

          <div class="options-row">
            <div class="options-row-text">
              <label class="options-label" for="filter-select"
                >Which meetings</label
              >
              <div class="options-hint">Hide events you've declined.</div>
            </div>
            <select id="filter-select" class="options-select">
              <option value="acceptedTentative">
                Accepted &amp; tentative
              </option>
              <option value="all">All events</option>
            </select>
          </div>
        </div>

        <div
          class="options-connection"
          id="connection-row"
          data-connected="false"
        >
          <span class="dot"></span>
          <div class="options-connection-text">
            <div class="options-connection-label" id="connection-status">
              Checking connection…
            </div>
            <div class="options-connection-email" id="connection-email"></div>
          </div>
          <button
            id="connection-button"
            class="options-button"
            type="button"
            hidden
          >
            Open Google Calendar
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
